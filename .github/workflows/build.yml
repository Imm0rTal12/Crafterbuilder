name: Build APK
on: [workflow_dispatch, push]
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {run: 'unzip -q "$(ls CraftBuilders_LAN_project.zip | LC_ALL=C sort | tail -1)" -d proj; g=$(ls Crafterbuilders.html 2>/dev/null | LC_ALL=C sort -V | tail -1); if [ -n "$g" ]; then cp "$g" proj/app/src/main/assets/www/index.html; fi'}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: 17}}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: 8.9}}, {run: 'cd proj && gradle assembleDebug --no-daemon'}, {uses: actions/upload-artifact@v4, with: {name: CraftBuilders-LAN-apk, path: proj/app/build/outputs/apk/debug/app-debug.apk}}]}}
